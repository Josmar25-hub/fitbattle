<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBattle - Treino em Grupo 🔥</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import "https://cdn.jsdelivr.net/npm/tailwindcss@4.0.0/dist/tailwind.min.css";
    </style>
    <!-- SDK DO FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-amber-400">🏋️‍♂️ FitBattle Interativo</h1>
            <p class="text-slate-400">Supere seus limites e domine o placar com seus amigos! 🔥</p>
            <div id="status-nuvem" class="text-xs text-emerald-400 font-bold animate-pulse">⏳ Conectando ao Firebase...</div>
        </header>

        <!-- Seção de Autenticação -->
        <section id="auth-section" class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 space-y-4 hidden">
            <h2 class="text-xl font-bold text-emerald-400">👤 Acesso ao Perfil</h2>
            
            <div id="form-login-box" class="space-y-3">
                <input type="text" id="auth-username" placeholder="Seu nome (ex: Josemar)" class="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl focus:outline-none focus:border-amber-400">
                <div class="relative">
                    <input type="password" id="auth-password" placeholder="Sua senha de acesso" class="w-full bg-slate-900 border border-slate-700 px-4 py-3 pr-12 rounded-xl focus:outline-none focus:border-amber-400">
                    <button type="button" onclick="toggleSenha()" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-200 text-sm cursor-pointer" id="btn-eye">👁️</button>
                </div>
                <input type="text" id="auth-contact" placeholder="Seu E-mail ou WhatsApp (para recuperação)" class="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl focus:outline-none focus:border-amber-400">
                <div class="flex gap-3 pt-2">
                    <button onclick="fazerLogin()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer">Entrar 🚀</button>
                    <button onclick="criarPerfilComSenha()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer">Criar Conta ➕</button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-700/60">
                <span class="text-xs text-slate-400 block mb-2">Perfis cadastrados:</span>
                <div id="users-list" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <!-- Painel Principal -->
        <div id="main-panel" class="hidden space-y-6">
            <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700">
                <div>
                    <span class="text-slate-400">Logado como:</span>
                    <strong id="current-user-display" class="text-amber-400 text-lg"></strong>
                </div>
                <button onclick="sair()" class="text-sm bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded-lg transition cursor-pointer">Sair</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Meus Exercícios -->
                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 space-y-4">
                    <h2 class="text-xl font-bold text-emerald-400">💪 Meus Exercícios de Hoje</h2>
                    <div class="space-y-3">
                        <input type="text" id="exercise-name" placeholder="Nome do Exercício (ex: Flexão)" class="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl focus:outline-none focus:border-amber-400">
                        <button onclick="adicionarExercicioFixo()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer">Fixar Novo Exercício 🚀</button>
                    </div>
                    <div id="my-exercises-list" class="space-y-3 mt-4 max-h-72 overflow-y-auto"></div>
                </div>

                <!-- Placar Diário -->
                <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 space-y-4">
                    <h2 class="text-xl font-bold text-amber-400">🏆 Placar Diário</h2>
                    <div id="leaderboard" class="space-y-2 max-h-80 overflow-y-auto"></div>
                </div>
            </div>

            <!-- Chat -->
            <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 space-y-4">
                <h2 class="text-xl font-bold text-sky-400">💬 Chat Interativo</h2>
                <div id="chat-messages" class="bg-slate-900 h-48 rounded-xl p-4 overflow-y-auto space-y-3 border border-slate-700/50"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Mande uma mensagem..." class="flex-1 bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl focus:outline-none focus:border-sky-400" onkeypress="handleChatKey(event)">
                    <button onclick="enviarMensagem()" class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition cursor-pointer">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE -->
    <script>
        // CONFIGURAÇÃO DO FIREBASE (Substitua depois se criar o seu próprio projeto)
        const firebaseConfig = {
    apiKey: "AIzaSyCHKSlMQ8l0Uu7L2nnqtLl3pNHZQFSxZ9o",
    authDomain: "fitbattle-2ba4d.firebaseapp.com",
    projectId: "fitbattle-2ba4d",
    storageBucket: "fitbattle-2ba4d.firebasestorage.app",
    messagingSenderId: "786627964179",
    appId: "1:786627964179:web:4674053bc4e1f0d0bd7ee6",
    measurementId: "G-RSY4407BWF"
    };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = localStorage.getItem('fitbattle_user') || null;
        let users = [];
        let workouts = [];
        let messages = [];

        // Salvar dados no Firestore
        async function salvarNaNuvenFirebase() {
            try {
                await db.collection("app").doc("estado_global").set({
                    users: users,
                    workouts: workouts,
                    messages: messages
                });
            } catch (e) {
                console.error("Erro ao salvar no Firebase:", e);
            }
        }

        // Ouvir em tempo real (Realtime automático do Firestore)
        function escutarFirebase() {
            db.collection("app").doc("estado_global")
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        users = data.users || [];
                        workouts = data.workouts || [];
                        messages = data.messages || [];
                        
                        document.getElementById('status-nuvem').innerText = '✅ Online e sincronizado via Firebase!';
                        document.getElementById('status-nuvem').classList.remove('animate-pulse');

                        if (currentUser) {
                            renderizarMeusExercicios();
                            atualizarPlacar();
                            atualizarChat();
                        } else {
                            renderizarListaUsuarios();
                        }
                    } else {
                        // Se o documento não existe ainda, cria o primeiro estado vazio
                        salvarNaNuvenFirebase();
                    }
                });
        }

        function iniciarApp() {
            escutarFirebase();

            if (currentUser) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-panel').classList.remove('hidden');
                document.getElementById('current-user-display').innerText = currentUser;
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-panel').classList.add('hidden');
            }
        }

        function toggleSenha() {
            const inputPass = document.getElementById('auth-password');
            const btnEye = document.getElementById('btn-eye');
            if (inputPass.type === 'password') { inputPass.type = 'text'; btnEye.innerText = '🙈'; } 
            else { inputPass.type = 'password'; btnEye.innerText = '👁️'; }
        }

        async function criarPerfilComSenha() {
            const nome = document.getElementById('auth-username').value.trim();
            const senha = document.getElementById('auth-password').value.trim();
            const contato = document.getElementById('auth-contact').value.trim();

            if (!nome || !senha || !contato) return alert('Preencha todos os campos!');
            if (users.find(u => u.name.toLowerCase() === nome.toLowerCase())) return alert('Nome já existe!');
            
            users.push({ name: nome, pass: senha, contact: contato });
            currentUser = nome;
            localStorage.setItem('fitbattle_user', currentUser);
            
            await salvarNaNuvenFirebase();
            iniciarApp();
        }

        function fazerLogin() {
            const nome = document.getElementById('auth-username').value.trim();
            const senha = document.getElementById('auth-password').value.trim();
            const conta = users.find(u => u.name.toLowerCase() === nome.toLowerCase() && u.pass === senha);
            
            if (!conta) return alert('Nome ou senha incorretos!');
            
            currentUser = conta.name;
            localStorage.setItem('fitbattle_user', currentUser);
            iniciarApp();
        }

        function renderizarListaUsuarios() {
            const lista = document.getElementById('users-list');
            lista.innerHTML = '';
            if (users.length === 0) { lista.innerHTML = '<p class="text-xs text-slate-500 italic">Nenhuma conta ainda. Crie a primeira!</p>'; return; }

            users.forEach((u) => {
                const btnUser = document.createElement('button');
                btnUser.innerText = u.name;
                btnUser.className = 'bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded-lg cursor-pointer';
                btnUser.onclick = () => {
                    document.getElementById('auth-username').value = u.name;
                    document.getElementById('auth-password').focus();
                };
                lista.appendChild(btnUser);
            });
        }

        function sair() {
            currentUser = null;
            localStorage.removeItem('fitbattle_user');
            iniciarApp();
        }

        async function adicionarExercicioFixo() {
            const nomeEx = document.getElementById('exercise-name').value.trim();
            if (!nomeEx) return alert('Digite o exercício!');
            const hoje = new Date().toLocaleDateString();
            workouts.push({ user: currentUser, exercise: nomeEx, reps: 0, date: hoje });
            await salvarNaNuvenFirebase();
            renderizarMeusExercicios();
            atualizarPlacar();
        }

        async function somarReps(indexOriginal, qtd) {
            if (isNaN(qtd) || qtd <= 0) return alert('Valor inválido!');
            workouts[indexOriginal].reps += qtd;
            await salvarNaNuvenFirebase();
            renderizarMeusExercicios();
            atualizarPlacar();
        }

        function renderizarMeusExercicios() {
            const hoje = new Date().toLocaleDateString();
            const listaDiv = document.getElementById('my-exercises-list');
            listaDiv.innerHTML = '';
            const meusExercicios = workouts.map((w, i) => ({ ...w, originalIndex: i })).filter(w => w.user === currentUser && w.date === hoje);
            
            if (meusExercicios.length === 0) return listaDiv.innerHTML = '<p class="text-slate-500 italic text-sm">Nenhum exercício hoje.</p>';
            
            meusExercicios.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 p-3.5 rounded-xl border border-slate-700/60 flex flex-col gap-2';
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-200">${item.exercise}</span>
                        <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-bold">Total: ${item.reps} reps</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="add-val-${item.originalIndex}" placeholder="+ Reps" class="flex-1 bg-slate-800 border border-slate-700 px-3 py-2 text-sm rounded-lg focus:outline-none focus:border-emerald-400">
                        <button onclick="executarSoma(${item.originalIndex})" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm px-4 py-2 rounded-lg transition cursor-pointer">Adicionar</button>
                    </div>
                `;
                listaDiv.appendChild(card);
            });
        }

        function executarSoma(idx) {
            const inputVal = document.getElementById(`add-val-${idx}`);
            somarReps(idx, parseInt(inputVal.value));
            inputVal.value = '';
        }

        function atualizarPlacar() {
            const hoje = new Date().toLocaleDateString();
            const placarMap = {};
            workouts.filter(w => w.date === hoje).forEach(w => placarMap[w.user] = (placarMap[w.user] || 0) + w.reps);
            
            const leaderboardDiv = document.getElementById('leaderboard');
            leaderboardDiv.innerHTML = '';
            const ranking = Object.entries(placarMap).sort((a, b) => b[1] - a[1]);
            
            if (ranking.length === 0) return leaderboardDiv.innerHTML = '<p class="text-slate-500 italic text-sm">Nenhuma pontuação hoje.</p>';
            
            ranking.forEach(([user, total], index) => {
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-3 rounded-xl border ${user === currentUser ? 'bg-amber-500/10 border-amber-500/30' : 'bg-slate-900 border-slate-700/50'}`;
                item.innerHTML = `
                    <div class="flex items-center gap-3"><span class="font-bold text-amber-400">#${index + 1}</span><span>${user}</span></div>
                    <span class="font-extrabold text-emerald-400">${total} reps</span>
                `;
                leaderboardDiv.appendChild(item);
            });
        }

        async function enviarMensagem() {
            const texto = document.getElementById('chat-input').value.trim();
            if (!texto) return;
            messages.push({
                user: currentUser, text: texto,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            await salvarNaNuvenFirebase();
            document.getElementById('chat-input').value = '';
            atualizarChat();
        }

        function handleChatKey(e) { if (e.key === 'Enter') enviarMensagem(); }

        function atualizarChat() {
            const chatDiv = document.getElementById('chat-messages');
            chatDiv.innerHTML = '';
            if (messages.length === 0) return chatDiv.innerHTML = '<p class="text-slate-500 italic text-sm text-center py-8">Mande a primeira mensagem!</p>';
            
            messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = 'space-y-0.5';
                bubble.innerHTML = `
                    <div class="flex justify-between text-xs text-slate-400">
                        <span class="font-semibold text-amber-400">${msg.user}</span>
                        <span>${msg.time}</span>
                    </div>
                    <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700/60 text-sm">${msg.text}</div>
                `;
                chatDiv.appendChild(bubble);
            });
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        iniciarApp();
    </script>
</body>
</html>
